
name: royal

services:
  backend:
    build: ./backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./backend/.env.production
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
