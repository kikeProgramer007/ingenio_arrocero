<app-floating-configurator />
<div class="login-royal min-h-screen min-w-[100vw] flex items-center justify-center overflow-hidden px-4">
    <div class="flex flex-col items-center justify-center w-full max-w-lg">
        <div class="login-royal-frame p-[3px] rounded-[2rem] w-full">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-12 px-8 sm:px-12 rounded-[1.85rem]">
                <div class="text-center mb-8">
                    <img [src]="empresa.logo" [alt]="empresa.nombre" class="login-royal-logo mx-auto mb-5" />
                    <div class="text-surface-900 dark:text-surface-0 text-2xl font-semibold mb-1">{{ empresa.nombre }}</div>
                    <span class="text-muted-color font-medium">{{ empresa.slogan }}</span>
                </div>

                <div>
                    <label for="username" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Usuario</label>
                    <input pInputText id="username" type="text" placeholder="Usuario" class="w-full mb-6" [(ngModel)]="loginObj.username" (keyup.enter)="onLogin()" />

                    <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Contraseña</label>
                    <p-password inputId="password" [(ngModel)]="loginObj.password" placeholder="Contraseña" [toggleMask]="true" styleClass="mb-6" [fluid]="true" [feedback]="false" (keyup.enter)="onLogin()"></p-password>

                    @if (errorMensaje) {
                        <small class="block text-red-500 mb-3">{{ errorMensaje }}</small>
                    }
                    <p-button label="Ingresar" styleClass="w-full" [loading]="loading" (onClick)="onLogin()"></p-button>
                </div>
            </div>
        </div>
    </div>
</div>
